name: Fetch swisstopo buildings (one-off)

# Lädt einmalig die swissBUILDINGS3D-Kacheln, die unsere Spielkarte abdecken,
# schneidet mit GDAL unser Gebiet aus und legt die Rohdaten gepackt in tools/swisstopo-roh/.
# Danach wandelt tools/swisstopo_to_game.py sie in assets/gebaeude.js um.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/fetch-buildings.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: sudo apt-get update -q && sudo apt-get install -y -q gdal-bin
      - name: Download tiles from data.geo.admin.ch
        shell: python3 {0}
        run: |
          import io, json, os, urllib.request, zipfile
          BBOX = '8.4980,47.1500,8.5220,47.1830'   # Spielkarte mit etwas Rand (lon/lat)
          url = ('https://data.geo.admin.ch/api/stac/v0.9/collections/'
                 f'ch.swisstopo.swissbuildings3d_3_0/items?bbox={BBOX}&limit=100')
          get = lambda u: urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'play-zone-game-map'}), timeout=600)
          for item in json.load(get(url))['features']:
              if '-' not in item['id']:
                  continue                          # ganze Schweiz: viel zu gross
              for key, asset in item['assets'].items():
                  if key.endswith('.gdb.zip'):
                      print('download', asset['href'])
                      zipfile.ZipFile(io.BytesIO(get(asset['href']).read())).extractall('tiles/' + item['id'])
      - name: Cut out our map area
        run: |
          mkdir -p tools/swisstopo-roh
          for gdb in $(find tiles -type d -name '*.gdb'); do
            tile=$(basename $(dirname "$gdb"))
            ogrinfo -so -al "$gdb" | grep -E "^(Layer name|Geometry|Feature Count)" || true
            for layer in $(ogrinfo -q "$gdb" | sed -E 's/^[0-9]+: ([^ ]+).*/\1/'); do
              ogr2ogr -f GeoJSONSeq /vsistdout/ "$gdb" "$layer" -spat 2680450 1222850 2681950 1226150 -spat_srs EPSG:2056 \
                -nlt MULTIPOLYGON -lco RS=NO | gzip -9 > "tools/swisstopo-roh/${tile}_${layer}.geojsonl.gz"
            done
          done
          find tools/swisstopo-roh -size -100c -delete
          ls -la tools/swisstopo-roh
      - name: Commit the raw data (temporary)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add tools/swisstopo-roh
          git commit -m "Add raw swisstopo building data around the game map (temporary)"
          git push
