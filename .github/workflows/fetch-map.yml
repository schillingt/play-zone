name: Fetch map from OpenStreetMap (one-off)

# Lädt einmalig die Gegend rund um die OYM-Halle aus OpenStreetMap
# und legt sie gepackt als tools/osm-area.json.gz in den Branch.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/fetch-map.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download OSM data around the OYM hall
        shell: python3 {0}
        run: |
          import gzip, json, math, os, time, urllib.parse, urllib.request
          URL = 'https://overpass-api.de/api/interpreter'
          def overpass(q):
              for i in range(5):
                  try:
                      req = urllib.request.Request(URL, data=urllib.parse.urlencode({'data': q}).encode(),
                                                   headers={'User-Agent': 'play-zone-game-map'})
                      with urllib.request.urlopen(req, timeout=300) as r:
                          return json.load(r)
                  except Exception as e:
                      print('retry', i, e); time.sleep(30 * (i + 1))
              raise SystemExit('overpass failed')
          find = overpass('[out:json][timeout:120];area["ISO3166-2"="CH-ZG"]->.a;nwr["name"~"OYM",i](area.a);out center tags;')
          for e in find['elements']:
              print(e['type'], e['id'], e.get('center'), e['tags'].get('name'), e['tags'].get('building'))
          hall = [e for e in find['elements'] if 'building' in e['tags'] and 'HALL' in e['tags'].get('name', '').upper()] \
              or [e for e in find['elements'] if 'building' in e['tags']]
          c = hall[0]['center']
          r = 2500
          dlat, dlon = r / 110540, r / (111320 * math.cos(math.radians(c['lat'])))
          bbox = [c['lat'] - dlat, c['lon'] - dlon, c['lat'] + dlat, c['lon'] + dlon]
          b = ','.join(f'{v:.6f}' for v in bbox)
          area = overpass(f'[out:json][timeout:600][maxsize:1000000000][bbox:{b}];(way[highway];nwr[building];nwr[landuse];'
                          'nwr[natural];nwr[leisure];way[waterway];way[railway];nwr[amenity=parking];);out geom;')
          area['bbox'] = bbox
          area['goal'] = [hall[0]['type'], hall[0]['id']]
          os.makedirs('tools', exist_ok=True)
          with gzip.open('tools/osm-area.json.gz', 'wt') as f:
              json.dump(area, f, separators=(',', ':'))
          print('elements', len(area['elements']), 'bytes', os.path.getsize('tools/osm-area.json.gz'))
      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add tools/osm-area.json.gz
          git commit -m "Add OpenStreetMap data around the OYM hall (temporary)"
          git push
